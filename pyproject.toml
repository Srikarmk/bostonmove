[project]
name = "bostonmove"
version = "0.1.0"
description = "Getting around Boston: live MBTA departures and alerts, Bluebikes availability, and door-to-door trip options with up to one subway change. CLI and MCP server; read-only."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kameswara Sai Srikar Manda" }]
keywords = ["mbta", "bluebikes", "boston", "transit", "gbfs", "mcp", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["mcp>=2.3,<3", "httpx>=0.27", "tzdata; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/Srikarmk/bostonmove"
Source = "https://github.com/Srikarmk/bostonmove"
Issues = "https://github.com/Srikarmk/bostonmove/issues"

[project.scripts]
bostonmove = "bostonmove.cli:main"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real MBTA, Bluebikes and OpenStreetMap APIs (run with -m live)"]

[tool.ruff]
line-length = 120
